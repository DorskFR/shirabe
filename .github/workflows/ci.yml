name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (stable + nightly fmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # fmt uses unstable options (imports_granularity), so it needs nightly.
      - name: fmt
        run: cargo +nightly fmt --check
      # Pin to +stable: the nightly toolchain step above makes nightly the
      # default, and clippy is only installed on stable (nightly carries rustfmt).
      - name: clippy
        run: cargo +stable clippy --all-targets -- -D warnings
      - name: test
        run: cargo +stable test

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: musicbrainz
          POSTGRES_PASSWORD: musicbrainz
          POSTGRES_DB: musicbrainz_db
        ports:
          - 5490:5432
        options: >-
          --health-cmd "pg_isready -U musicbrainz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: test-integration
        run: make test-integration
