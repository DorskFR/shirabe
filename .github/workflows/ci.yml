name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (stable + nightly fmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # fmt uses unstable options (imports_granularity), so it needs nightly.
      - name: fmt
        run: cargo +nightly fmt --check
      # Pin to +stable: the nightly toolchain step above makes nightly the
      # default, and clippy is only installed on stable (nightly carries rustfmt).
      - name: clippy
        run: cargo +stable clippy --all-targets -- -D warnings
      - name: test
        run: cargo +stable test
